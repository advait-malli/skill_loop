<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Skill Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="page-content">
        <a href="home.html" class="btn btn-ghost btn-back"><span class="material-symbols-outlined">arrow_back</span> Home</a>
        <h1>Create a New Post</h1>
        <div class="create-layout">
            <div class="create-card">
                <div class="create-card-header">
                    <div class="avatar-md" id="user-avatar">?</div>
                    <span id="user-name">Loading...</span>
                </div>
                <div class="create-card-body">
                    <div class="create-field">
                        <label for="post-title">Title</label>
                        <input type="text" id="post-title" placeholder="What are you offering or looking for?">
                    </div>
                    <div class="create-field">
                        <label for="post-body">Description</label>
                        <textarea id="post-body" rows="5" placeholder="Describe your skill, availability, and what you'd like in return..."></textarea>
                    </div>
                    <div class="create-field">
                        <label for="post-image">Thumbnail</label>
                        <input type="file" id="post-image" accept="image/*">
                        <div class="image-preview" id="image-preview" style="display:none">
                            <img id="preview-img" src="" alt="Thumbnail preview">
                            <button type="button" class="btn-secondary" id="remove-image" style="margin-top:8px"><span class="material-symbols-outlined inline-icon">close</span> Remove</button>
                        </div>
                    </div>
                    <div class="create-field">
                        <label for="post-files">Attachments</label>
                        <input type="file" id="post-files" multiple>
                        <div class="upload-status" id="upload-status"></div>
                        <div class="file-chips" id="file-chips"></div>
                    </div>
                    <div class="create-tags" id="create-tags"></div>
                </div>
                <div class="create-card-footer">
                    <button class="btn-secondary" onclick="window.location.href='home.html'">Cancel</button>
                    <button class="btn-primary" id="submit-btn">
                        Post <span class="material-symbols-outlined inline-icon">send</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './api.js';

        let currentUserId = null;

        async function init() {
            try {
                const user = await api.accounts.getCurrent();
                currentUserId = user.id;
                const ua = document.getElementById('user-avatar');
                if (user.avatarUrl) {
                    ua.innerHTML = `<img src="${user.avatarUrl}" alt="">`;
                } else {
                    ua.textContent = user.avatar || '?';
                }
                document.getElementById('user-name').textContent = user.displayName || 'Unknown';
            } catch (e) {
                console.error('Failed to load user:', e);
            }
        }

        // Thumbnail upload
        let thumbnailPath = '';
        const imageInput = document.getElementById('post-image');
        const previewEl = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const removeImageBtn = document.getElementById('remove-image');

        imageInput.addEventListener('change', async () => {
            const file = imageInput.files[0];
            if (!file) return;
            previewImg.src = URL.createObjectURL(file);
            previewEl.style.display = 'block';
            try {
                const meta = await api.upload.file(file);
                thumbnailPath = meta.path;
            } catch (err) {
                console.error('Thumbnail upload failed:', err);
                thumbnailPath = '';
            }
            imageInput.value = '';
        });

        removeImageBtn.addEventListener('click', () => {
            thumbnailPath = '';
            previewImg.src = '';
            previewEl.style.display = 'none';
        });

        // File uploads
        let uploadedFiles = [];
        let pendingUploads = [];
        const filesInput = document.getElementById('post-files');
        const chipsEl = document.getElementById('file-chips');
        const uploadStatus = document.getElementById('upload-status');

        function renderFileChips() {
            chipsEl.innerHTML = uploadedFiles.map((f, i) => `
                <span class="file-chip">
                    <span class="material-symbols-outlined inline-icon">${f.icon}</span>${f.name}
                    <span class="chip-remove" data-idx="${i}" title="Remove">
                        <span class="material-symbols-outlined inline-icon" style="font-size:0.9rem">close</span>
                    </span>
                </span>
            `).join('');
            chipsEl.querySelectorAll('.chip-remove').forEach(btn => {
                btn.addEventListener('click', () => {
                    uploadedFiles.splice(parseInt(btn.dataset.idx), 1);
                    renderFileChips();
                });
            });
        }

        filesInput.addEventListener('change', () => {
            const selected = Array.from(filesInput.files);
            filesInput.value = '';
            if (selected.length === 0) return;
            uploadStatus.textContent = `Uploading ${selected.length} file${selected.length > 1 ? 's' : ''}...`;
            uploadStatus.classList.remove('error');
            selected.forEach(file => {
                const task = api.upload.file(file)
                    .then(meta => {
                        uploadedFiles.push(meta);
                        renderFileChips();
                        uploadStatus.textContent = '';
                    })
                    .catch(err => {
                        console.error('Upload failed:', err);
                        uploadStatus.textContent = `Failed to upload ${file.name}`;
                        uploadStatus.classList.add('error');
                    });
                pendingUploads.push(task);
            });
        });

        // Auto-detect tags from body
        const bodyInput = document.getElementById('post-body');
        bodyInput.addEventListener('input', () => {
            const tags = extractTags(bodyInput.value);
            const tagsEl = document.getElementById('create-tags');
            tagsEl.innerHTML = tags.map(t => `<span class="detected-tag"><span class="material-symbols-outlined inline-icon">${t.icon}</span>${t.label}</span>`).join('');
        });

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const title = document.getElementById('post-title').value.trim();
            const body = document.getElementById('post-body').value.trim();

            if (!title && !body) {
                alert('Please add a title or description.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined inline-icon">hourglass_empty</span> Uploading...';
            uploadStatus.textContent = '';
            await Promise.all(pendingUploads);
            pendingUploads = [];
            btn.innerHTML = '<span class="material-symbols-outlined inline-icon">hourglass_empty</span> Posting...';

            try {
                await api.posts.create({
                    authorId: currentUserId,
                    title,
                    body,
                    image: thumbnailPath || `https://placehold.co/640x360/1e293b/00EBA9?text=${encodeURIComponent(title || 'Post')}`,
                    files: uploadedFiles,
                    tags: extractTags(body).map(t => t.icon)
                });
                window.location.href = 'home.html';
            } catch (err) {
                console.error('Failed to create post:', err);
                alert('Failed to create post. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined inline-icon">send</span> Post';
            }
        });

        function extractTags(text) {
            const tagMap = {
                'guitar': { icon: 'music_note', label: 'Music' },
                'music': { icon: 'music_note', label: 'Music' },
                'song': { icon: 'music_note', label: 'Music' },
                'piano': { icon: 'music_note', label: 'Music' },
                'photo': { icon: 'camera', label: 'Photography' },
                'photography': { icon: 'camera', label: 'Photography' },
                'portrait': { icon: 'camera', label: 'Photography' },
                'cook': { icon: 'restaurant', label: 'Cooking' },
                'cooking': { icon: 'restaurant', label: 'Cooking' },
                'recipe': { icon: 'restaurant', label: 'Cooking' },
                'spanish': { icon: 'language', label: 'Language' },
                'language': { icon: 'language', label: 'Language' },
                'web': { icon: 'computer', label: 'Tech' },
                'design': { icon: 'computer', label: 'Design' },
                'code': { icon: 'computer', label: 'Coding' },
                'yoga': { icon: 'self_improvement', label: 'Wellness' },
                'meditation': { icon: 'self_improvement', label: 'Wellness' },
            };
            const seen = new Set();
            const tags = [];
            const words = text.toLowerCase().split(/\s+/);
            words.forEach(w => {
                if (tagMap[w] && !seen.has(tagMap[w].icon)) {
                    seen.add(tagMap[w].icon);
                    tags.push(tagMap[w]);
                }
            });
            return tags;
        }

        init();
    </script>
</body>
</html>
