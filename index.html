<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>window.puter || (window.puter = {}); window.puter.quiet = true;</script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="theme.js"></script>
</head>
<body>
    <nav class="navbar">
        <ul class="left">
            <li><a href="home.html" style="text-decoration:none"><img src="assets/logo-light.png" data-theme-logo="logo" alt="Skill Loop" class="logo"></a></li>
        </ul>
        <ul class="center">
            <li class="active" data-page="home.html"><a><span class="material-symbols-outlined">home</span><span class="pagename"> Home</span></a></li>
            <li data-page="learn.html"><a><span class="material-symbols-outlined">class</span><span class="pagename"> Courses</span></a></li>
            <li data-page="my_account.html"><a><span class="material-symbols-outlined">person</span><span class="pagename"> My Account</span></a></li>
        </ul>
        <ul class="right">
            <li class="nav-icon" id="settings-btn"><a class="icon-btn" title="Settings" role="button"><span class="material-symbols-outlined">settings</span></a></li>
            <li class="nav-icon" id="chat-btn"><a class="icon-btn" title="Ask Loopa" role="button"><span class="material-symbols-outlined">auto_awesome</span></a></li>
            <li class="nav-icon" id="logout-btn"><a class="icon-btn" title="Log Out"><span class="material-symbols-outlined">logout</span></a></li>
            <li class="nav-icon" id="more-btn"><a class="icon-btn" role="button" title="More"><span class="material-symbols-outlined">more_horiz</span></a></li>
        </ul>
        <div class="more-menu" id="more-menu">
            <button id="more-settings" type="button"><span class="material-symbols-outlined">settings</span> Settings</button>
            <button id="more-chat" type="button"><span class="material-symbols-outlined">auto_awesome</span> Ask Loopa</button>
            <button id="more-logout" type="button"><span class="material-symbols-outlined">logout</span> Log Out</button>
        </div>
    </nav>

    <div class="app-shell">
        <iframe id="content-frame" class="content-frame" src="home.html"></iframe>

        <div class="sidebar-track" id="sidebar-track">
            <aside class="sidebar" id="ai-sidebar" aria-label="Loopa chat">
        <div class="sidebar-header">
            <div class="sidebar-title">Loopa<small>Skill Loop AI assistant</small></div>
            <button class="icon-btn" id="ai-close" title="Close"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Ask Loopa about courses, posts, members..." autocomplete="off">
            <button class="icon-btn icon-btn-lg icon-btn-accent" id="chat-send" title="Send"><span class="material-symbols-outlined">arrow_upward</span></button>
        </div>
    </aside>

    <aside class="sidebar" id="settings-sidebar" aria-label="Settings">
        <div class="sidebar-header">
            <div class="sidebar-title">Settings</div>
            <button class="icon-btn" id="settings-close" title="Close"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="settings-body">
            <div class="setting-row">
                <div class="setting-label">
                    <span class="setting-name">Theme</span>
                    <span class="setting-desc">Appearance across all pages</span>
                </div>
                <div class="segment" id="theme-segment">
                    <button data-theme-value="system">Auto</button>
                    <button data-theme-value="light">Light</button>
                    <button data-theme-value="dark">Dark</button>
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-label">
                    <span class="setting-name">AI Features</span>
                    <span class="setting-desc">Show or hide the Loopa button</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="ai-feature-toggle">
                    <span class="track"></span>
                </label>
            </div>
        </div>
    </aside>
        </div>
    </div>

    <a id="page-fab" class="fab hidden" aria-label="Create new course">
        <span class="material-symbols-outlined">add</span>
    </a>

    <script type="module">
        import { checkAuth, logout } from './auth.js';

        // Auth guard
        const user = await checkAuth();
        if (!user) {
            window.location.href = 'landing.html';
        }

        // Navigation
        const links = document.querySelectorAll('nav ul.center li[data-page]');
        const frame = document.getElementById('content-frame');
        const fab = document.getElementById('page-fab');
        const fabPages = ['learn.html'];

        function updateFab(page) {
            if (fabPages.includes(page)) {
                fab.classList.remove('hidden');
            } else {
                fab.classList.add('hidden');
            }
        }

        updateFab(frame.src.split('/').pop());

        fab.addEventListener('click', () => {
            frame.src = 'create_course.html';
            updateFab('create_course.html');
        });

        links.forEach(link => {
            link.addEventListener('click', () => {
                links.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const page = link.getAttribute('data-page');
                frame.src = page;
                updateFab(page);
            });
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await logout();
            window.location.href = 'landing.html';
        });

        // ---------- Sidebars ----------
        const aiSidebar = document.getElementById('ai-sidebar');
        const settingsSidebar = document.getElementById('settings-sidebar');
        const sidebarTrack = document.getElementById('sidebar-track');
        let openSidebarId = null;

        const SIDEBARS = { ai: aiSidebar, settings: settingsSidebar };

        // The ONLY function allowed to change sidebar open-state. Guarantees
        // that at most one sidebar is ever marked 'open'. Closed sidebars are
        // display:none, so a hidden sidebar simply does not exist in the
        // render tree.
        function setSidebar(openId) {
            openSidebarId = openId || null;
            aiSidebar.classList.remove('open');
            settingsSidebar.classList.remove('open');
            const target = SIDEBARS[openId];
            if (target) {
                target.classList.add('open');
                sidebarTrack.classList.add('open');
            } else {
                sidebarTrack.classList.remove('open');
            }
        }

        function openSidebar(id) {
            if (openSidebarId === id) {
                setSidebar(null); // tapping the same button closes it
            } else {
                setSidebar(id);
            }
        }

        function closeAllSidebars() {
            setSidebar(null);
        }

        // DOM-level guard: no matter what adds the class, the moment BOTH
        // sidebars ever carry 'open', force the non-intended one closed.
        const enforceSingleOpen = () => {
            const aiOpen = aiSidebar.classList.contains('open');
            const settingsOpen = settingsSidebar.classList.contains('open');
            if (aiOpen && settingsOpen) {
                if (openSidebarId === 'settings') {
                    aiSidebar.classList.remove('open');
                } else {
                    settingsSidebar.classList.remove('open');
                }
            }
        };
        const sidebarGuard = new MutationObserver(enforceSingleOpen);
        sidebarGuard.observe(aiSidebar, { attributes: true, attributeFilter: ['class', 'style'] });
        sidebarGuard.observe(settingsSidebar, { attributes: true, attributeFilter: ['class', 'style'] });

        // Clean slate: never start with a sidebar open (drops stale '.open'
        // state that could linger from a previous session).
        setSidebar(null);

        function openChatFromBar() {
            closeMoreMenu();
            openSidebar('ai');
            if (!chatStarted) startChat();
            document.getElementById('chat-input').focus();
        }
        function openSettingsFromBar() {
            closeMoreMenu();
            openSidebar('settings');
            syncSettingsUI();
        }
        document.getElementById('chat-btn').addEventListener('click', openChatFromBar);
        document.getElementById('settings-btn').addEventListener('click', openSettingsFromBar);

        // ---------- More (⋯) menu on small screens ----------
        const moreBtn = document.getElementById('more-btn');
        const moreMenu = document.getElementById('more-menu');
        function closeMoreMenu() {
            moreBtn.classList.remove('active');
            moreMenu.classList.remove('open');
        }
        function toggleMoreMenu() {
            moreBtn.classList.toggle('active');
            moreMenu.classList.toggle('open');
        }
        moreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMoreMenu();
        });
        moreMenu.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', closeMoreMenu);
        document.getElementById('more-settings').addEventListener('click', openSettingsFromBar);
        document.getElementById('more-chat').addEventListener('click', openChatFromBar);
        document.getElementById('more-logout').addEventListener('click', async () => {
            closeMoreMenu();
            await logout();
            window.location.href = 'landing.html';
        });
        document.getElementById('ai-close').addEventListener('click', closeAllSidebars);
        document.getElementById('settings-close').addEventListener('click', closeAllSidebars);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMoreMenu();
                closeAllSidebars();
            }
        });

        // ---------- Theme ----------
        function setThemeSetting(value) {
            localStorage.setItem('skillloop_theme', value);
            const dark = value === 'dark' || (value === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.querySelectorAll('#theme-segment button').forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-theme-value') === value);
            });
        }
        function syncSettingsUI() {
            const current = localStorage.getItem('skillloop_theme') || 'system';
            document.querySelectorAll('#theme-segment button').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-theme-value') === current);
            });
            document.getElementById('ai-feature-toggle').checked =
                localStorage.getItem('skillloop_ai_enabled') !== 'false';
        }
        document.querySelectorAll('#theme-segment button').forEach(btn => {
            btn.addEventListener('click', () => setThemeSetting(btn.getAttribute('data-theme-value')));
        });

        // ---------- AI features toggle ----------
        function refreshAiButton() {
            const enabled = localStorage.getItem('skillloop_ai_enabled') !== 'false';
            document.getElementById('chat-btn').style.display = enabled ? '' : 'none';
            document.getElementById('more-chat').style.display = enabled ? '' : 'none';
            if (!enabled && openSidebarId === 'ai') {
                closeAllSidebars();
            }
        }
        refreshAiButton();
        document.getElementById('ai-feature-toggle').addEventListener('change', (e) => {
            localStorage.setItem('skillloop_ai_enabled', e.target.checked ? 'true' : 'false');
            refreshAiButton();
        });

        // ---------- Loopa AI chat ----------
        let chatStarted = false;
        let chatContext = null;
        let chatHistory = [];

        async function buildContext() {
            try {
                const [accounts, posts, courses] = await Promise.all([
                    fetch('/api/accounts').then(r => r.json()),
                    fetch('/api/posts').then(r => r.json()),
                    fetch('/api/courses').then(r => r.json())
                ]);
                return JSON.stringify({
                    posts: posts.map(p => ({
                        title: p.title,
                        body: p.body,
                        by: p.author ? p.author.displayName : p.authorId,
                        likes: p.likes ? p.likes.length : 0,
                        files: p.files ? p.files.map(f => f.name) : []
                    })),
                    courses: courses.map(c => ({
                        title: c.title,
                        instructor: c.instructor,
                        description: c.description,
                        lessons: c.totalLessons,
                        progress: c.progress
                    })),
                    members: accounts.map(a => ({
                        name: a.displayName,
                        offers: a.skillsOffered,
                        wants: a.skillsWanted
                    }))
                });
            } catch (err) {
                console.error('Failed to build Loopa context:', err);
                return 'Website data is currently unavailable.';
            }
        }

        function addMessage(role, text) {
            const el = document.createElement('div');
            el.className = 'chat-msg ' + role;
            el.textContent = text;
            document.getElementById('chat-messages').appendChild(el);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
            return el;
        }

        function startChat() {
            chatStarted = true;
            addMessage('welcome', "Hi, I'm Loopa! Ask me about courses, posts, members, or anything else here on Skill Loop.");
        }

        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        async function sendChat() {
            const text = chatInput.value.trim();
            if (!text || !window.puter) {
                if (!window.puter) addMessage('assistant', "Loopa couldn't connect. Please check your internet connection and try again.");
                return;
            }
            chatInput.value = '';
            chatSend.disabled = true;

            addMessage('user', text);
            chatHistory.push({ role: 'user', text });
            const typingEl = addMessage('assistant', '…');
            const typing = document.createElement('span');
            typing.className = 'chat-typing';
            typing.textContent = 'Loopa is thinking...';
            typingEl.replaceWith(typing);

            if (!chatContext) chatContext = await buildContext();

            const messages = [
                { role: 'system', content: "You are Loopa, the helpful AI assistant for the Skill Loop website, a skill-sharing platform where members swap skills through posts, courses, and comments. Be friendly, warm, and concise. Use the website data below to answer questions about courses, posts, and members. If the answer isn't in the data, say you're not sure rather than guessing.\n\nHere is the current Skill Loop website data:\n" + chatContext }
            ].concat(chatHistory.map(m => ({ role: m.role, content: m.text })));

            try {
                const response = await puter.ai.chat(messages, { model: 'gpt-4o-mini', stream: false, normalize: true });
                let reply = 'Sorry, I could not generate a response.';
                if (typeof response === 'string') {
                    reply = response;
                } else if (response && typeof response.message?.content === 'string') {
                    reply = response.message.content;
                } else if (response && Array.isArray(response.message?.content)) {
                    reply = response.message.content
                        .filter(b => b && typeof b.text === 'string')
                        .map(b => b.text)
                        .join('\n');
                }
                typing.replaceWith(addMessage('assistant', reply));
                chatHistory.push({ role: 'assistant', text: reply });
            } catch (err) {
                console.error('Loopa error:', err);
                typing.replaceWith(addMessage('assistant', 'Sorry, Loopa hit an error' + (err && err.message ? ': ' + err.message : '. Please try again.')));
            } finally {
                chatSend.disabled = false;
                chatInput.focus();
            }
        }

        chatSend.addEventListener('click', sendChat);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });
    </script>
</body>
</html>
