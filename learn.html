<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn - Skill Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="page-content">
        <div class="learn-header">
            <h1>Courses</h1>
            <div class="learn-tabs">
                <button class="learn-tab active" data-filter="in-progress,completed">My Courses</button>
                <button class="learn-tab" data-filter="not-started">Explore</button>
                <button class="learn-tab" data-filter="all">All</button>
            </div>
        </div>

        <div class="search-bar" role="search">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="search" id="search-input" placeholder="Search courses..." aria-label="Search courses">
            <button class="icon-btn icon-btn-sm search-clear" id="search-clear" title="Clear search" aria-label="Clear search"><span class="material-symbols-outlined">close</span></button>
        </div>

        <div class="course-grid" id="courses-grid">
            <div class="loading">Loading courses...</div>
        </div>
    </div>

    <script type="module">
        import { api, renderCourseCard } from './api.js';

        let allCourses = [];
        let activeFilter = 'in-progress,completed';
        let searchTimer = null;

        async function loadCourses() {
            try {
                allCourses = await api.courses.getAll();
                renderFiltered(activeFilter, '');
            } catch (e) {
                console.error('Failed to load courses:', e);
                document.getElementById('courses-grid').innerHTML = '<div class="error">Failed to load courses</div>';
            }
        }

        function matchesQuery(course, query) {
            const terms = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
            if (terms.length === 0) return true;
            const haystack = [course.title || '', course.instructor || ''].join(' ').toLowerCase();
            return terms.every(term => haystack.includes(term));
        }

        function renderFiltered(filter, query = '') {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = '';
            let filtered;
            if (filter === 'all') {
                filtered = allCourses;
            } else {
                const statuses = filter.split(',');
                filtered = allCourses.filter(c => statuses.includes(c.status));
            }

            const term = query.trim();
            filtered = filtered.filter(c => matchesQuery(c, query));

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined" style="font-size:48px;color:var(--text-muted)">search_off</span><p>No courses found' + (term ? ' for "' + term + '"' : '') + '</p></div>';
                return;
            }

            filtered.forEach(course => {
                const card = renderCourseCard(course);
                grid.appendChild(card);
            });
        }

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        document.querySelectorAll('.learn-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.learn-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                activeFilter = tab.dataset.filter;
                renderFiltered(activeFilter, searchInput.value);
            });
        });

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchClear.classList.toggle('visible', searchInput.value.trim().length > 0);
                renderFiltered(activeFilter, searchInput.value);
            }, 150);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            renderFiltered(activeFilter, '');
            searchInput.focus();
        });

        loadCourses();
    </script>
</body>
</html>
