<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Skill Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="landing.html"><img src="assets/logo.png" alt="Skill Loop" class="auth-logo"></a>
                    <h1>Create your account</h1>
                    <p>Join the community and start swapping skills</p>
                </div>
                <div class="auth-error" id="auth-error"></div>
                <form class="auth-form" id="signup-form">
                    <div class="auth-field">
                        <label for="displayName">Display Name</label>
                        <input type="text" id="displayName" name="displayName" placeholder="e.g. Alex Morgan" required>
                    </div>
                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username">
                    </div>
                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 4 characters" required minlength="4" autocomplete="new-password">
                    </div>
                    <button type="submit" class="auth-submit" id="submit-btn">Create Account</button>
                </form>
                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth, signup } from './auth.js';

        const user = await checkAuth();
        if (user) {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('signup-form');
        const errorEl = document.getElementById('auth-error');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtn.textContent = 'Creating account...';
            submitBtn.disabled = true;

            const displayName = document.getElementById('displayName').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            try {
                await signup(displayName, username, password);
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Signup failed. Please try again.';
                errorEl.style.display = 'block';
                submitBtn.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
