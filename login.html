<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Skill Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <a href="landing.html"><img src="assets/logo.png" alt="Skill Loop" class="auth-logo"></a>
                    <h1>Welcome back</h1>
                    <p>Log in to your Skill Loop account</p>
                </div>
                <div class="auth-error" id="auth-error"></div>
                <form class="auth-form" id="login-form">
                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="auth-submit" id="submit-btn">Log In</button>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth, login } from './auth.js';

        // Redirect if already logged in
        const user = await checkAuth();
        if (user) {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('auth-error');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                await login(username, password);
                window.location.href = 'index.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed. Please try again.';
                errorEl.style.display = 'block';
                submitBtn.textContent = 'Log In';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
